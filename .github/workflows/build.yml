name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ "26.2", "26.1.2", "1.21.11" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build Minecraft ${{ matrix.version }}
        working-directory: versions/${{ matrix.version }}
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-YHaddition-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
